
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin Pearson</title>

<style>
:root {
    --pigeon: #898D87;
    --almond: #F7B8C4;
    --lime: #CAFF00;
    --black: #000000;
    --white: #FFFFFF;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--pigeon);
    color: var(--black);
    font-family: Arial, Helvetica, sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 6%;
    font-weight: bold;
}

.logo {
    font-size: 28px;
}

main {
    padding: 10vh 6%;
}

h1 {
    font-size: clamp(48px, 12vw, 180px);
    line-height: 0.85;
    letter-spacing: -0.065em;
    color: var(--almond);
    margin: 0 0 35px;
}

.tag {
    display: inline-block;
    background: var(--lime);
    padding: 12px 18px;
    font-weight: bold;
}

.projects {
    margin-top: 60px;
    border-top: 2px solid black;
}

.project {
    padding: 20px 0;
    border-bottom: 1px solid black;
    font-size: 24px;
    font-weight: bold;
}

.project:hover {
    color: var(--lime);
}

footer {
    padding: 30px 6%;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <div class="logo">MP.</div>
    <div>INDEPENDENT / CREATIVE</div>
</header>

<main>
    <img src="plan-a-picnic.png" alt="Goblin picnic" style="float:right; width:45%; max-width:630px; margin-left:20px;">
    <h1>MARTIN<br>PEARSON.</h1>

    <div class="tag">An ongoing collection of ideas.</div>

    <div class="projects">
        <div class="project">01 — Music</div>
        <div class="project">02 — Photography</div>
        <div class="project">03 — Writing</div>
        <div class="project">04 — Creative Projects</div>
    </div>
</main>

<footer>
    © 2026 Martin Pearson
</footer>

</body>
</html>
